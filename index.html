<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koddan3D | Linkler</title>
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg0:#000000; --bg1:#0b0b0b; --panel:#0a0a0a; --muted:#bfbfbf; --white:#ffffff; --border:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh;
    background: radial-gradient(1000px 600px at 25% 15%, var(--bg1), transparent 60%),
                linear-gradient(135deg, var(--bg0), var(--bg1));
    display:flex; align-items:center; justify-content:center;
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    color:var(--white);
  }
  .card{
    width:100%; max-width:520px; padding:28px 22px 28px;
    background:color-mix(in oklab, var(--panel) 92%, black 8%);
    border:1px solid var(--border);
    border-radius:24px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
  }
  .avatar{
    width:108px; height:108px; border-radius:999px; overflow:hidden;
    display:block; margin:0 auto 14px; background: var(--bg0);
    border:2px solid rgba(255,255,255,.35);
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .title{ text-align:center; font-weight:800; font-size:28px; margin:4px 0 6px;}
  .handle{ text-align:center; font-size:14px; opacity:.9; margin-bottom:14px}
  .tagline{ text-align:center; font-size:14px; color:var(--muted); margin:0 8px 18px }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; padding:16px 18px; margin:10px 0;
    background:rgba(255,255,255,.02); color:var(--white);
    border:1px solid var(--border); border-radius:14px;
    text-decoration:none; font-weight:700; letter-spacing:.2px;
    transition: transform .08s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn:hover{ transform: translateY(-1px); background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.28); }
  .btn:active{ transform: translateY(0); }
  .btn svg{ width:22px; height:22px; }
  .fine{ text-align:center; font-size:12px; opacity:.7; margin-top:12px}
</style>
